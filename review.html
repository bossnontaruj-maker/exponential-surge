<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทบทวน — Exponential Surge</title>
<link rel="stylesheet" href="engine/style.css">
</head>
<body>
<div class="wrap">
  <h1>ทบทวนวันนี้</h1>
  <p class="lede">คำถามจากทุกโมดูลที่ถึงกำหนด — ข้อที่เคยตอบผิดบ่อยจะขึ้นก่อน</p>
  <div id="app"><p class="muted">กำลังโหลดคลังคำถาม…</p></div>
  <p style="margin-top:2rem"><a href="index.html">← กลับหน้าหลัก</a></p>
</div>

<script>window.QUIZ_BANK = {};</script>
<script src="data/curriculum.js"></script>
<script src="engine/srs.js"></script>
<script src="engine/quiz.js"></script>
<script>
// โหลดคลังคำถามของทุกโมดูลที่สร้างเสร็จแล้ว
const ready = CURRICULUM.modules.filter(m => m.status === "ready");
let pending = ready.length;

if (!pending) start();
ready.forEach(m => {
  const s = document.createElement("script");
  s.src = `modules/${m.dir}/quiz-data.js`;
  s.onload = s.onerror = () => { if (--pending === 0) start(); };
  document.head.appendChild(s);
});

function start() {
  const app = document.getElementById("app");
  const due = dueCards();

  // จับคู่ id การ์ด (เช่น "01-q3") กลับไปหาตัวคำถาม
  // เก็บ id การ์ดเต็มไว้กับตัวคำถาม เพื่อไม่ให้ q1 ของคนละโมดูลชนกัน
  const questions = [];
  due.forEach(card => {
    const bank = QUIZ_BANK[card.id.slice(0, 2)] || [];
    const q = bank.find(x => x.id === card.id.slice(3));
    if (q) questions.push(Object.assign({}, q, { id: card.id }));
  });

  if (!questions.length) {
    app.innerHTML = `<div class="card">
        <p>วันนี้ไม่มีอะไรต้องทบทวน</p>
        <p class="small muted">ทำควิซของโมดูลก่อน แล้วคำถามจะเข้าคิวมาที่นี่เองตามรอบ 1 · 3 · 7 · 14 · 30 · 60 วัน
        ข้อที่ตอบผิดจะถูกดึงกลับมาเริ่มที่ 1 วันใหม่</p>
      </div>`;
    return;
  }

  const head = document.createElement("p");
  head.className = "small muted";
  head.textContent = `ถึงกำหนด ${questions.length} ข้อ`;
  app.innerHTML = "";
  app.appendChild(head);

  const box = document.createElement("div");
  app.appendChild(box);
  renderQuiz(box, "", questions);
}
</script>
</body>
</html>
