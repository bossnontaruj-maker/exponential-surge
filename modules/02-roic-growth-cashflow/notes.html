const NOTES_SPEC = {"title": "บันทึกของผม — โมดูล 2", "intro": ["<strong>กติกา:</strong> เขียนโดยปิด <code>concept.md</code> ข้อไหนเขียนไม่ออกคือข้อที่ยังไม่เข้าใจจริง — กลับไปอ่านเฉพาะข้อนั้น", "ห้ามลอกประโยคจากเนื้อหา ถ้าอธิบายให้คนที่ไม่รู้การเงินฟังไม่ได้ แปลว่ายังไม่ผ่าน"], "sections": [{"title": "อุ่นเครื่อง — เขียน 2 ข้อนี้ก่อนเริ่มอ่าน concept", "items": [{"id": "s0q0", "kind": "text", "label": "<strong>ก. อธิบาย ROIC ให้เพื่อนที่ไม่รู้การเงินฟังใน 3 ประโยค — ห้ามใช้คำว่า \"ผลตอบแทน\" และ \"เงินทุน\" (ต้องมี \"อะไรหารด้วยอะไร\")</strong>", "placeholder": "เขียนตรงนี้"}, {"id": "s0q1", "kind": "text", "label": "<strong>ข. บริษัทที่ดีมากทุกคนรู้ว่าดี — ทำไมคนที่ซื้อหุ้นวันนี้อาจได้ผลตอบแทนแค่เท่าต้นทุนเงินทุน? (ตอบ \"ทำไม\" ให้จบ ความคาดหวังไปอยู่ในอะไร)</strong>", "placeholder": "เขียนตรงนี้"}, {"id": "s0q2", "kind": "text", "label": "<strong>หลังอ่านจบ กลับมาเทียบกับหัวข้อ \"กลับไปเช็คคำตอบอุ่นเครื่อง\" ท้าย concept แล้วเขียนว่าของตัวเองขาดอะไร:</strong>", "placeholder": "เขียนตรงนี้"}]}, {"title": "อธิบายกลับด้วยภาษาตัวเอง", "items": [{"id": "s1q0", "kind": "text", "label": "<strong>1. ทำไมสองบริษัทที่กำไรเท่ากันและโตเท่ากัน ถึงมีมูลค่าต่างกันได้</strong>", "placeholder": "เขียนตรงนี้"}, {"id": "s1q1", "kind": "text", "label": "<strong>2. กระแสเงินสดอิสระคืออะไร และสูตร \"อัตราลงทุนซ้ำ = g ÷ ROIC\" บอกอะไร</strong>", "placeholder": "เขียนตรงนี้"}, {"id": "s1q2", "kind": "text", "label": "<strong>3. \"ลู่วิ่ง\" คืออะไร และทำไมการโตเร็วขึ้นถึงทำลายมูลค่าได้</strong>", "placeholder": "เขียนตรงนี้"}, {"id": "s1q3", "kind": "text", "label": "<strong>4. บริษัท ROIC สูงกับบริษัท ROIC ต่ำ ควรทุ่มแรงไปคนละทางอย่างไร เพราะอะไร</strong>", "placeholder": "เขียนตรงนี้"}, {"id": "s1q4", "kind": "text", "label": "<strong>5. หลักอนุรักษ์มูลค่าคืออะไร ยกตัวอย่างข้อเสนอที่ดู \"ได้ของฟรี\" มา 1 อย่างแล้วอธิบายว่าทำไมไม่ฟรี</strong>", "placeholder": "เขียนตรงนี้"}]}, {"title": "อธิบายให้คนอื่นฟัง", "items": [{"id": "s2q0", "kind": "text", "label": "ลองเขียนอธิบาย <strong>กระแสเงินสดอิสระ</strong> ให้เพื่อนที่ไม่ได้เรียนการเงินฟังใน 3 ประโยค โดยห้ามใช้คำว่า \"กระแสเงินสด\" และ \"ลงทุน\"", "placeholder": "เขียนตรงนี้"}]}, {"title": "คำตอบเคส (case.md)", "items": [{"id": "t3", "kind": "table", "headers": ["ข้อ", "คำตอบของผม", "ถูก/ผิด", "ผิดเพราะอะไร"], "rows": [{"n": "1", "editable": [true, true, true]}, {"n": "2", "editable": [true, true, true]}, {"n": "3", "editable": [true, true, true]}, {"n": "4", "editable": [true, true, true]}, {"n": "5", "editable": [true, true, true]}, {"n": "6", "editable": [true, true, true]}, {"n": "7", "editable": [true, false, false]}]}]}, {"title": "จุดที่ผมเข้าใจผิดตอนแรก", "items": [{"id": "s4q0", "kind": "text", "label": null, "placeholder": "ข้อไหนที่ตอบผิดในควิซหรือเกม แล้วเพิ่งมาเข้าใจทีหลัง — เขียนไว้ แล้วย้ายไป knowledge/insights.md (ดูประวัติควิซที่หน้าทบทวน ถ้าเคยตอบผิดแม้แต่รอบเดียว ข้อนั้นต้องอยู่ตรงนี้)"}]}, {"title": "คำถามที่ยังค้างอยู่", "items": [{"id": "s5q0", "kind": "text", "label": null, "placeholder": "อะไรที่ยังไม่เคลียร์ ไว้ถามในโมดูลถัดไป"}]}]};
